# -------------------------------------------------------
# HORIZONTAL POD AUTOSCALER (HPA)
# Automatically scales the number of Pod replicas based
# on observed CPU or memory utilization.
#
# Requires Metrics Server to be running:
#   Minikube : minikube addons enable metrics-server
# -------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: react-app-hpa
  namespace: react-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: react-app

  minReplicas: 2   # Never scale below 2 pods
  maxReplicas: 5   # Never scale above 5 pods

  metrics:
    # ---- Scale up when average CPU exceeds 60% ----
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    # ---- Scale up when average memory exceeds 70% ----
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
