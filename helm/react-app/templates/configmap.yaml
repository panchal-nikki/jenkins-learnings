{{/*
  ConfigMap template
  Reads key-value pairs from values.yaml → config section
  and creates a Kubernetes ConfigMap.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "react-app.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "react-app.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
