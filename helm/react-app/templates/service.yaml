{{/*
  Service template
  The service type (NodePort/ClusterIP/LoadBalancer) comes from values.yaml.
  nodePort is only rendered when type is NodePort.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "react-app.fullname" . }}-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "react-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "react-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
